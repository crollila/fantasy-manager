<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Pair Fantasy Manager</title><style>body{font:13px system-ui;background:#122236;color:#e0ebf5;width:355px;padding:18px}label{display:block;margin:13px 0 5px}input,textarea{width:100%;box-sizing:border-box;background:#20364d;color:white;border:1px solid #546b80;padding:8px}textarea{height:80px}button{margin:12px 6px 0 0;padding:9px;background:#8bd7ba;border:0;border-radius:4px}pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:11px}small{color:#b0c4d7}</style></head><body><h2>ESPN → Local optimizer</h2><small>Read only. No draft clicks or credential access.</small><label>Local pairing token</label><input id="token" type="password"><label>ESPN league ID (must match local ID)</label><input id="league"><label>Your ESPN team ID</label><input id="myteam" type="number"><label>Season</label><input id="season" type="number" value="2026"><label>Week</label><input id="week" type="number" min="1" max="18" value="1"><label>Team names or ESPN IDs → zero-based local index</label><textarea id="teams" placeholder='{"My Team":0,"Other Team":1}'></textarea><label>Draft row CSS selector (optional)</label><input id="selector" placeholder="Use built-in adapters"><button id="save">Enable monitor</button><button id="sync">Sync league</button><button id="stop">Pause</button><button id="inspect">Inspect current page</button><pre id="status"></pre><script src="popup.js"></script></body></html>
