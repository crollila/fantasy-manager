name: Build Windows installer
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build installer
        shell: pwsh
        run: ./scripts/build-desktop.ps1
      - name: Test frozen engine
        shell: pwsh
        run: ./.build-venv/Scripts/python.exe scripts/smoke_frozen.py
      - uses: actions/upload-artifact@v4
        with:
          name: Fantasy-Manager-Windows
          path: release/Fantasy-Manager-Setup-*.exe
